services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: research-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # A named volume, not a host bind mount: under rootless podman the
      # container's user cannot write to a host directory owned by the calling
      # UID, and SELinux blocks it too. A named volume sidesteps both.
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image is distroless: no curl/wget. Its own binary can probe itself.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  qdrant_storage:
